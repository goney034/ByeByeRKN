name: Release

# Builds a signed release APK and publishes it as a GitHub Release.
# Start it from the Actions tab (Run workflow, enter a tag such as v0.1.0), or push a tag like v0.1.0.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded in one line
#   KEYSTORE_PASSWORD  its password (also used as the key password)
#   KEY_ALIAS          the key alias
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make sure Android platform 36 is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p keystore
          # Drop spaces, quotes and line breaks that can sneak in when the secret is pasted.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n"'"'"'' > keystore/release.b64
          if ! base64 -d keystore/release.b64 > keystore/release.jks 2> keystore/b64.err; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (length $(wc -c < keystore/release.b64)). Paste the whole content of release.jks.b64 again."
            exit 1
          fi
          rm -f keystore/release.b64 keystore/b64.err
          if ! keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore opened badly: check KEYSTORE_PASSWORD and KEY_ALIAS, or that KEYSTORE_BASE64 is complete."
            exit 1
          fi
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and name the file
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "ByeByeRKN-fa-${TAG}.apk"
          sha256sum "ByeByeRKN-fa-${TAG}.apk" | tee "ByeByeRKN-fa-${TAG}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 "ByeByeRKN-fa-${TAG}.apk.sha256")
          cat > notes.md <<EOF
          نسخه‌ی فارسی (بتا) از [ByeByeRKN](https://github.com/alexus282/ByeByeRKN). این نسخه‌ی رسمی نیست و یک فورک تغییریافته است.

          Persian-translated fork of [alexus282/ByeByeRKN](https://github.com/alexus282/ByeByeRKN). Not the official build.

          SHA-256: \`$SHA\`
          EOF
          gh release create "$TAG" \
            "ByeByeRKN-fa-${TAG}.apk" \
            "ByeByeRKN-fa-${TAG}.apk.sha256" \
            --title "ByeByeRKN فارسی $TAG (بتا)" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
